name: Release & Publish

# ZIP und MyREDAXO-Upload laufen beim Veröffentlichen eines GitHub-Releases –
# unabhängig davon, ob der Tag „1.2.5“ oder „v1.2.5“ heißt.
# Manuell (workflow_dispatch) lässt sich das ZIP für ein bestehendes Release nachträglich anhängen.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      job:
        description: 'Welcher Job soll ausgeführt werden?'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - redaxo_publish
      version:
        description: 'Tag des Releases, z. B. 1.2.5'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release ZIP
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.job == 'release')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Kein Neubau: die minifizierten Assets liegen im Repo (build/build.mjs vor dem Release).
      # So ist das ZIP identisch mit dem, was der REDAXO-Installer ausliefert.
      - name: Release-ZIP erstellen
        run: |
          ZIP_NAME="vector_maps_${TAG}.zip"

          zip -r "$ZIP_NAME" . \
            --exclude "*.git*" \
            --exclude ".gitignore" \
            --exclude ".github/*" \
            --exclude "build/*" \
            --exclude "*.map" \
            --exclude "*.DS_Store" \
            --exclude "*.swp"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: ZIP an das Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ZIP_NAME }}

  redaxo_publish:
    name: Publish to REDAXO.org
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.job == 'redaxo_publish')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - if: hashFiles('composer.json') != ''
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--no-dev"
      - uses: FriendsOfREDAXO/installer-action@v1
        with:
          myredaxo-username: ${{ secrets.MYREDAXO_USERNAME }}
          myredaxo-api-key: ${{ secrets.MYREDAXO_API_KEY }}
          description: ${{ github.event.release.body }}
          version: ${{ github.event.release.tag_name || inputs.version }}
